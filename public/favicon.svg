<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A050E" />
      <stop offset="100%" stop-color="#1A0309" />
    </linearGradient>
    <linearGradient id="maroonFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E1128" />
      <stop offset="100%" stop-color="#4A0A1A" />
    </linearGradient>
    <linearGradient id="goldTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#EED396" />
    </linearGradient>
    <linearGradient id="bevelSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#380713" />
      <stop offset="100%" stop-color="#150207" />
    </linearGradient>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#4A0A1A" stroke-width="2"/>

  <!-- 3D Geometric Isometric Letter 'F' -->
  <g filter="url(#shadow3d)" transform="translate(18, 16)">
    
    <!-- 3D Depth / Extrusion Shadow Faces -->
    <path d="M 28 8 L 36 2 L 78 2 L 70 8 Z" fill="url(#goldTop)" opacity="0.95" />
    <path d="M 70 8 L 78 2 L 86 10 L 78 18 Z" fill="#9A7736" />
    <path d="M 70 8 L 78 18 L 70 24 L 62 18 Z" fill="#2A050E" />
    
    <!-- Vertical Spine Depth -->
    <path d="M 28 8 L 36 2 L 36 80 L 28 88 Z" fill="url(#bevelSide)" />
    
    <!-- Middle Arm Depth -->
    <path d="M 28 42 L 34 38 L 62 38 L 56 46 Z" fill="url(#goldTop)" opacity="0.9" />
    <path d="M 56 46 L 62 38 L 68 44 L 62 52 Z" fill="#9A7736" />
    
    <!-- Main Front Faces of Letter F -->
    <!-- Vertical Stem -->
    <polygon points="12,18 28,8 28,88 12,98" fill="url(#maroonFront)" stroke="#C5A059" stroke-width="1.5" />
    
    <!-- Top Horizontal Bar -->
    <polygon points="28,8 70,8 62,24 28,24" fill="url(#maroonFront)" stroke="#C5A059" stroke-width="1.5" />
    
    <!-- Middle Horizontal Bar -->
    <polygon points="28,42 56,46 50,58 28,54" fill="url(#maroonFront)" stroke="#C5A059" stroke-width="1.5" />
    
    <!-- Polished Gold Edge Accents -->
    <line x1="12" y1="18" x2="28" y2="8" stroke="#EED396" stroke-width="2.5" />
    <line x1="28" y1="8" x2="70" y2="8" stroke="#EED396" stroke-width="2.5" />
    <line x1="28" y1="42" x2="56" y2="46" stroke="#EED396" stroke-width="2" />
    
    <!-- White Cream Highlight Facet -->
    <polygon points="22,12 28,8 34,14 28,18" fill="#FDFBF7" opacity="0.8" />
    <polygon points="22,44 28,42 32,46 26,48" fill="#FDFBF7" opacity="0.75" />
  </g>
</svg>
